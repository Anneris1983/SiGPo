<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos - Profesor | SiGPo</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #5C1018; --accent: #C49A2A; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        body { font-family: 'DM Sans', sans-serif; background: #f8f6f1; font-size: 14px; }

        /* HEADER */
        .header { background: linear-gradient(135deg, #5C1018 0%, #8C1A28 100%); color: white; padding: 20px 40px; }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
        .header-top-left { flex: 1; min-width: 280px; }
        .breadcrumb { font-size: 14px; margin-bottom: 12px; }
        .breadcrumb a { color: white; text-decoration: none; opacity: 0.9; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .breadcrumb a:hover { background: rgba(255,255,255,0.24); }
        .header h1 { font-family: 'Crimson Pro', serif; font-size: 24px; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.85; }
        .btn-logout { display: flex; align-items: center; gap: 7px; padding: 9px 18px; background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.38); color: white; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; font-family: 'DM Sans', sans-serif; transition: background 0.2s; white-space: nowrap; flex-shrink: 0; margin-top: 4px; }
        .btn-logout:hover { background: rgba(255,255,255,0.24); }

        /* LAYOUT */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 32px; }

        /* SUMMARY CARDS */
        .summary-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 28px; }
        .summary-card { background: white; border-radius: 14px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #e0e0e0; }
        .summary-card.c-ejecutado  { border-color: var(--danger); }
        .summary-card.c-proyectado { border-color: var(--warning); }
        .summary-card.c-total      { border-color: #0891b2; }
        .summary-card.c-categorias { border-color: #6366f1; }
        .summary-card.c-proveedores { border-color: var(--primary); }
        .summary-label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .summary-value { font-size: 26px; font-weight: 700; color: var(--primary); line-height: 1; }
        .summary-sub { font-size: 12px; color: #aaa; margin-top: 6px; }

        /* FILTERS */
        .filters-bar { background: white; border-radius: 14px; padding: 20px 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-group select, .filter-group input { padding: 8px 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; background: white; color: #333; transition: border-color 0.2s; }
        .filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--primary); }
        .btn-reset { padding: 8px 16px; border: 2px solid #e5e7eb; border-radius: 8px; background: white; font-size: 13px; font-weight: 600; color: #666; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
        .btn-reset:hover { border-color: var(--danger); color: var(--danger); }

        /* TABLE */
        .card { background: white; border-radius: 14px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-family: 'Crimson Pro', serif; font-size: 20px; font-weight: 700; color: var(--primary); margin-bottom: 20px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead tr { background: var(--primary); color: white; }
        th { padding: 12px 14px; text-align: left; font-weight: 600; font-size: 12px; white-space: nowrap; }
        td { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
        tbody tr:hover { background: #fafaf8; }
        .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .badge-ejecutado  { background: #fce7e7; color: #991b1b; }
        .badge-proyectado { background: #fef3c7; color: #92400e; }
        .badge-pendiente  { background: #f3f4f6; color: #6b7280; }
        .badge-cancelado  { background: #d1fae5; color: #065f46; }
        .badge-parcial    { background: #fef3c7; color: #92400e; font-weight: 700; }
        .cat-chip { display: inline-block; background: #eef2ff; color: #4338ca; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .monto-neg { color: var(--danger); font-weight: 700; }
        .totals-row td { font-weight: 700; background: #f8f6f1; border-top: 2px solid var(--primary); }
        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty-state div { font-size: 36px; margin-bottom: 12px; }
        .skeleton-row td { background: linear-gradient(90deg,#e8e8e8 25%,#f5f5f5 50%,#e8e8e8 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; height: 44px; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        @media (max-width: 1100px) { .summary-cards { grid-template-columns: repeat(3,1fr); } }
        @media (max-width: 700px)  { .summary-cards { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 640px) { .header, .container { padding-left: 16px; padding-right: 16px; } }
    </style>
    <link rel="stylesheet" href="sigpo-theme.css">
    <link rel="stylesheet" href="sigpo-compact.css">
    <style>
        .container { max-width: 100% !important; width: 100% !important; margin: 20px 0 !important; padding: 0 32px !important; box-sizing: border-box !important; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div class="header-top-left">
            <div class="breadcrumb"><a href="profesor_1_dashboard.html">← Volver al Dashboard</a></div>
            <h1>💸 Gastos</h1>
            <p id="header-sub">Mis programas y cohortes asignadas</p>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
            <button type="button" class="btn-logout" onclick="cerrarSesion()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Cerrar sesión
            </button>
        </div>
    </div>
</div>

<div class="container">

    <div class="summary-cards">
        <div class="summary-card c-ejecutado">
            <div class="summary-label">Total Ejecutado</div>
            <div class="summary-value" id="sc-ejecutado">—</div>
            <div class="summary-sub" id="sc-ejecutado-n">registros</div>
        </div>
        <div class="summary-card c-proyectado">
            <div class="summary-label">Total Proyectado</div>
            <div class="summary-value" id="sc-proyectado">—</div>
            <div class="summary-sub" id="sc-proyectado-n">registros</div>
        </div>
        <div class="summary-card c-total">
            <div class="summary-label">Total Gastos</div>
            <div class="summary-value" id="sc-total">—</div>
            <div class="summary-sub" id="sc-total-n">registros</div>
        </div>
        <div class="summary-card c-categorias">
            <div class="summary-label">Categorías</div>
            <div class="summary-value" id="sc-categorias">—</div>
            <div class="summary-sub">distintas</div>
        </div>
        <div class="summary-card c-proveedores">
            <div class="summary-label">Proveedores</div>
            <div class="summary-value" id="sc-proveedores">—</div>
            <div class="summary-sub">distintos</div>
        </div>
    </div>

    <div class="filters-bar">
        <div class="filter-group">
            <label>Programa</label>
            <select id="f-programa" onchange="aplicarFiltros()"><option value="">Todos</option></select>
        </div>
        <div class="filter-group">
            <label>Categoría</label>
            <select id="f-categoria" onchange="aplicarFiltros()"><option value="">Todas</option></select>
        </div>
        <div class="filter-group">
            <label>Tipo</label>
            <select id="f-tipo" onchange="aplicarFiltros()">
                <option value="">Todos</option>
                <option value="EJECUTADO">Ejecutado</option>
                <option value="PROYECTADO">Proyectado</option>
                <option value="PARCIAL">Pago Parcial</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Estado</label>
            <select id="f-estado" onchange="aplicarFiltros()">
                <option value="">Todos</option>
                <option value="PENDIENTE">Pendiente</option>
                <option value="CANCELADO">Pagado</option>
                <option value="PARCIAL">Parcial</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Mes desde</label>
            <input type="month" id="f-desde" onchange="aplicarFiltros()">
        </div>
        <div class="filter-group">
            <label>Mes hasta</label>
            <input type="month" id="f-hasta" onchange="aplicarFiltros()">
        </div>
        <button class="btn-reset" onclick="resetFiltros()">✕ Limpiar</button>
    </div>

    <div class="card">
        <div class="card-title" id="table-title">Detalle de Gastos</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Programa</th>
                        <th>Categoría</th>
                        <th>Proveedor</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th style="text-align:right">Presupuestado</th>
                        <th style="text-align:right">Ejecutado</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    <tr class="skeleton-row"><td colspan="8"></td></tr>
                    <tr class="skeleton-row"><td colspan="8"></td></tr>
                    <tr class="skeleton-row"><td colspan="8"></td></tr>
                </tbody>
                <tfoot id="tabla-foot"></tfoot>
            </table>
            <div id="paginador-gastos"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>
var _todos = [];
var _progMap = {};
var _pagGas = 1, POR_PAG = 10;

function fM(n) { return '$ ' + Number(n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fMk(n) { return '$' + Math.round(n/1000).toLocaleString('es-AR') + 'k'; }
function mesKey(iso) { return String(iso||'').split('T')[0].substring(0,7); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fechaCorta(iso) {
    if (!iso) return '—';
    var p = String(iso).split('T')[0].split('-');
    return p[2]+'/'+p[1]+'/'+p[0];
}

function getFiltrados() {
    var fProg   = document.getElementById('f-programa').value;
    var fCat    = document.getElementById('f-categoria').value;
    var fTipo   = document.getElementById('f-tipo').value;
    var fEstado = document.getElementById('f-estado').value;
    var fDesde  = document.getElementById('f-desde').value;
    var fHasta  = document.getElementById('f-hasta').value;
    return _todos.filter(function(e) {
        if (fProg   && String(e.programa_id) !== fProg) return false;
        if (fCat    && (e.categoria||'Otros') !== fCat) return false;
        if (fTipo === 'PARCIAL'    && e.estado !== 'PARCIAL') return false;
        if (fTipo === 'EJECUTADO'  && !(e.tipo === 'EJECUTADO' && e.estado !== 'PARCIAL')) return false;
        if (fTipo === 'PROYECTADO' && !(e.tipo === 'PROYECTADO' && e.estado !== 'PARCIAL')) return false;
        if (fEstado && e.estado !== fEstado) return false;
        var mk = mesKey(e.fecha_pago || e.fecha_estimada);
        if (fDesde && mk && mk < fDesde) return false;
        if (fHasta && mk && mk > fHasta) return false;
        return true;
    });
}

function aplicarFiltros() {
    _pagGas = 1;
    var data = getFiltrados();
    renderSummary(data);
    renderTabla(data);
}

function resetFiltros() {
    ['f-programa','f-categoria','f-tipo','f-estado'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('f-desde').value = '';
    document.getElementById('f-hasta').value = '';
    aplicarFiltros();
}

function renderSummary(data) {
    var ejec  = data.filter(function(e){ return e.tipo==='EJECUTADO' && e.estado!=='PARCIAL'; });
    var parc  = data.filter(function(e){ return e.estado==='PARCIAL'; });
    var proy  = data.filter(function(e){ return e.tipo==='PROYECTADO' && e.estado!=='PARCIAL'; });
    var sumEj = ejec.reduce(function(s,e){ return s+Number(e.monto_pagado||0); },0)
              + parc.reduce(function(s,e){ return s+Number(e.monto_pagado||0); },0);
    var sumPr = proy.reduce(function(s,e){ return s+Number(e.monto_original||0); },0)
              + parc.reduce(function(s,e){ return s+Number(e.monto_pendiente||0); },0);
    var cats  = new Set(data.map(function(e){ return e.categoria||'Otros'; })).size;
    var provs = new Set(data.map(function(e){ return e.proveedor; }).filter(Boolean)).size;
    document.getElementById('sc-ejecutado').textContent    = fMk(sumEj);
    document.getElementById('sc-ejecutado-n').textContent  = (ejec.length+parc.length) + ' registros';
    document.getElementById('sc-proyectado').textContent   = fMk(sumPr);
    document.getElementById('sc-proyectado-n').textContent = (proy.length+parc.length) + ' registros';
    document.getElementById('sc-total').textContent        = fMk(sumEj + sumPr);
    document.getElementById('sc-total-n').textContent      = data.length + ' registros';
    document.getElementById('sc-categorias').textContent   = cats;
    document.getElementById('sc-proveedores').textContent  = provs;
}

function renderPaginadorGas(total) {
    var el = document.getElementById('paginador-gastos');
    if (!el) return;
    var totalPags = Math.ceil(total / POR_PAG);
    if (totalPags <= 1) { el.innerHTML = ''; return; }
    var desde = (_pagGas-1)*POR_PAG+1, hasta = Math.min(_pagGas*POR_PAG, total);
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid #e8e8e8;font-size:13px;color:#6B6254;">'
        + '<span>'+desde+'–'+hasta+' de '+total+'</span>'
        + '<div style="display:flex;align-items:center;gap:4px;">'
        + '<button onclick="cambiarPagGas('+(_pagGas-1)+')" '+(_pagGas===1?'disabled':'')+' style="padding:5px 12px;border:1px solid #e0e0e0;border-radius:6px;background:white;cursor:pointer;font-size:14px;">‹</button>'
        + '<span style="padding:0 12px;">Página '+_pagGas+' de '+totalPags+'</span>'
        + '<button onclick="cambiarPagGas('+(_pagGas+1)+')" '+(_pagGas===totalPags?'disabled':'')+' style="padding:5px 12px;border:1px solid #e0e0e0;border-radius:6px;background:white;cursor:pointer;font-size:14px;">›</button>'
        + '</div></div>';
}

function cambiarPagGas(pag) { _pagGas = pag; renderTabla(getFiltrados()); }

function renderTabla(data) {
    var tbody = document.getElementById('tabla-body');
    var tfoot = document.getElementById('tabla-foot');
    document.getElementById('table-title').textContent = 'Detalle de Gastos (' + data.length + ')';

    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div>📭</div>Sin registros para los filtros seleccionados</div></td></tr>';
        tfoot.innerHTML = ''; renderPaginadorGas(0); return;
    }

    var totalPags = Math.ceil(data.length / POR_PAG);
    _pagGas = Math.min(_pagGas, totalPags);
    var slice = data.slice((_pagGas-1)*POR_PAG, _pagGas*POR_PAG);

    var html = '';
    slice.forEach(function(e) {
        var parcial = e.estado === 'PARCIAL';
        var fecha   = fechaCorta((e.tipo==='EJECUTADO'||parcial) ? (e.fecha_pago||e.fecha_estimada) : e.fecha_estimada);
        var prog    = esc(_progMap[e.programa_id] || '—');
        var cat     = esc(e.categoria || 'Otros');
        var prov    = esc(e.proveedor || '—');
        var badgeT  = parcial
            ? '<span class="badge badge-parcial">Pago Parcial</span>'
            : e.tipo==='EJECUTADO'
                ? '<span class="badge badge-ejecutado">Ejecutado</span>'
                : '<span class="badge badge-proyectado">Proyectado</span>';
        var badgeE  = e.estado==='CANCELADO'
            ? '<span class="badge badge-cancelado">Pagado</span>'
            : parcial
                ? '<span class="badge badge-parcial">Parcial</span>'
                : '<span class="badge badge-pendiente">Pendiente</span>';
        var presup  = e.monto_original ? fM(e.monto_original) : '—';
        var ejecutado = (e.tipo==='EJECUTADO'||parcial) ? '<span class="monto-neg">'+fM(e.monto_pagado||0)+'</span>' : '—';
        html += '<tr>'
            + '<td>'+fecha+'</td>'
            + '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+prog+'">'+prog+'</td>'
            + '<td><span class="cat-chip">'+cat+'</span></td>'
            + '<td>'+prov+'</td>'
            + '<td>'+badgeT+'</td>'
            + '<td>'+badgeE+'</td>'
            + '<td style="text-align:right">'+presup+'</td>'
            + '<td style="text-align:right">'+ejecutado+'</td>'
            + '</tr>';
    });

    var totalPresup = data.reduce(function(s,e){ return s+Number(e.monto_original||0); }, 0);
    var totalEjec   = data.filter(function(e){ return e.tipo==='EJECUTADO'||e.estado==='PARCIAL'; })
                         .reduce(function(s,e){ return s+Number(e.monto_pagado||0); }, 0);

    tbody.innerHTML = html;
    tfoot.innerHTML = '<tr class="totals-row">'
        + '<td colspan="6" style="text-align:right;font-size:12px;color:#888;font-weight:600;">TOTALES</td>'
        + '<td style="text-align:right">'+fM(totalPresup)+'</td>'
        + '<td style="text-align:right;color:var(--danger)">'+fM(totalEjec)+'</td>'
        + '</tr>';
    renderPaginadorGas(data.length);
}

document.addEventListener('DOMContentLoaded', async function() {
    var sesion = getSesion();
    if (!sesion || sesion.rol !== 'PROFESOR') { window.location.href = 'portal_login.html'; return; }
    document.getElementById('header-sub').textContent = (sesion.nombre || 'Profesor/a') + ' · Gastos de mis programas y cohortes asignadas';

    try {
        var sb = await getSupabase();
        var progIds = await obtenerProgramasAsignadosPorDni(sesion.dni);

        if (!progIds.length) {
            document.getElementById('tabla-body').innerHTML = '<tr><td colspan="8"><div class="empty-state"><div>📭</div>No tenés programas asignados.</div></td></tr>';
            return;
        }

        var [rP, rC] = await Promise.all([
            sb.from('programas').select('programa_id,nombre').in('programa_id', progIds),
            sb.from('cohortes').select('cohorte_id,programa_id').in('programa_id', progIds)
        ]);
        (rP.data || []).forEach(function(p){ _progMap[p.programa_id] = p.nombre; });
        var cohIds = (rC.data || []).map(function(c){ return c.cohorte_id; });

        var rE = cohIds.length
            ? await sb.from('egresos')
                .select('egreso_id,programa_id,cohorte_id,tipo,estado,monto_original,monto_pagado,monto_pendiente,fecha_estimada,fecha_pago,categoria,proveedor,nro_comprobante')
                .in('cohorte_id', cohIds)
                .order('fecha_estimada', { ascending: false })
            : { data: [] };
        _todos = rE.data || [];

        /* Poblar filtros */
        var progs = Object.entries(_progMap).sort(function(a,b){ return a[1].localeCompare(b[1]); });
        var fProg = document.getElementById('f-programa');
        progs.forEach(function(p){ var o=document.createElement('option'); o.value=p[0]; o.textContent=p[1]; fProg.appendChild(o); });

        var cats = [...new Set(_todos.map(function(e){ return e.categoria||'Otros'; }))].sort();
        var fCat = document.getElementById('f-categoria');
        cats.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; fCat.appendChild(o); });

        aplicarFiltros();

    } catch(err) {
        console.error(err);
        document.getElementById('tabla-body').innerHTML = '<tr><td colspan="8" style="text-align:center;color:#ef4444;padding:40px;">Error al cargar datos</td></tr>';
    }
});
</script>
</body>
</html>
