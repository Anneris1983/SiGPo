<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — SiGPo FCE UNCUYO</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter','DM Sans',system-ui,sans-serif;
            background:  #F7F5F0;
            min-height:  100vh;
            display:     flex;
            align-items: center;
            justify-content: center;
            padding:     24px 16px;
            font-size:   14px;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Fondo decorativo sutil ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 10%, rgba(92,16,24,.05) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 80% 90%, rgba(196,154,42,.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Card ── */
        .login-container {
            width:     100%;
            max-width: 520px;
            position:  relative;
            z-index:   1;
        }

        .login-card {
            background:    #fff;
            border-radius: 20px;
            overflow:      hidden;
            box-shadow:    0 2px 4px rgba(10,15,30,.04),
                           0 8px 24px rgba(10,15,30,.07),
                           0 24px 48px rgba(10,15,30,.05);
            border:        1px solid #EFEAE0;
        }

        /* ── Logo ── */
        .login-header {
            padding:    28px 28px 22px;
            background: #fff;
            text-align: center;
            border-bottom: 1px solid #EFEAE0;
        }
        .login-brand-img {
            width:     100%;
            max-width: 480px;
            height:    auto;
            display:   block;
            margin:    0 auto;
        }

        /* ── Formulario ── */
        .login-body { padding: 32px 36px 24px; }

        .field { margin-bottom: 18px; }
        .field label {
            display:        block;
            font-size:      11.5px;
            font-weight:    700;
            color:          #594F42;
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom:  6px;
        }
        .field input {
            width:         100%;
            padding:       11px 14px;
            border:        1.5px solid #E6DFD2;
            border-radius: 10px;
            font-size:     15px;
            font-family:   'Inter','DM Sans',sans-serif;
            color:         #1C1510;
            background:    #fff;
            transition:    border-color .14s, box-shadow .14s;
        }
        .field input:hover:not(:focus) { border-color: #6B6254; }
        .field input:focus {
            outline:      none;
            border-color: #5C1018;
            box-shadow:   0 0 0 3px rgba(92,16,24,.08);
        }
        .field input::placeholder { color: #A89C88; }

        /* Contraseña */
        .field-password           { position: relative; }
        .field-password input     { padding-right: 46px; }
        .toggle-pass {
            position:   absolute;
            right:      13px;
            top:        50%;
            transform:  translateY(-50%);
            background: none;
            border:     none;
            cursor:     pointer;
            font-size:  17px;
            color:      #6B6254;
            padding:    4px;
            line-height: 1;
            transition: color .12s;
        }
        .toggle-pass:hover { color: #5C1018; }

        /* Error */
        .error-msg {
            display:       none;
            background:    #fff1f1;
            color:         #991b1b;
            padding:       10px 14px;
            border-radius: 8px;
            font-size:     13px;
            margin-bottom: 16px;
            border:        1px solid #fecaca;
            border-left:   4px solid #c0392b;
        }
        .error-msg.show { display: block; }

        /* ── Botón de login ── */
        .btn-login {
            width:          100%;
            padding:        13px 24px;
            background:     #5C1018;
            color:          #fff;
            border:         none;
            border-radius:  10px;
            font-family:    'Inter','DM Sans',sans-serif;
            font-size:      15px;
            font-weight:    700;
            letter-spacing: -.01em;
            cursor:         pointer;
            display:        flex;
            align-items:    center;
            justify-content: center;
            gap:            8px;
            transition:     background .14s, box-shadow .14s, transform .12s;
            margin-top:     6px;
        }
        .btn-login:hover    { background: #6f1420; box-shadow: 0 4px 16px rgba(92,16,24,.28); transform: translateY(-1px); }
        .btn-login:active   { background: #3d0a10; transform: none; box-shadow: none; }
        .btn-login:disabled { opacity: .55; cursor: not-allowed; transform: none; }

        .btn-login .spinner {
            display:       none;
            width:         18px;
            height:        18px;
            border:        2.5px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation:     spin .7s linear infinite;
        }
        .btn-login.loading .spinner  { display: inline-block; }
        .btn-login.loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Footer ── */
        .login-footer {
            padding:    16px 36px 28px;
            text-align: center;
            font-size:  12px;
            color:      #6B6254;
            line-height: 1.8;
        }
        .login-footer a {
            color:           #C49A2A;
            text-decoration: none;
            font-weight:     600;
            transition:      color .12s;
        }
        .login-footer a:hover { color: #b08820; text-decoration: underline; }

        /* ── Responsive ── */
        @media (max-width: 560px) {
            .login-header { padding: 20px 16px 18px; }
            .login-body   { padding: 24px 20px 20px; }
            .login-footer { padding: 12px 24px 24px; }
        }
    </style>
    <link rel="stylesheet" href="sigpo-theme.css">
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <!-- HEADER -->
        <div class="login-header">
            <img class="login-brand-img" src="assets/01_v4_original.svg" alt="SiGPo - Sistema de Gestión de Pagos para Posgrado">
        </div>

        <!-- FORM -->
        <div class="login-body">
            <div id="errorMsg" class="error-msg"></div>

            <div class="field">
                <label for="dni">DNI</label>
                <input type="text" id="dni" placeholder="Ingresá tu DNI" autocomplete="username" inputmode="numeric" maxlength="10"
                    onkeydown="if(event.key==='Enter') document.getElementById('password').focus()">
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <div class="field-password">
                    <input type="password" id="password" placeholder="Ingresá tu contraseña" autocomplete="current-password"
                        onkeydown="if(event.key==='Enter') iniciarSesion()">
                    <button type="button" class="toggle-pass" onclick="togglePassword()" title="Mostrar/ocultar contraseña">👁️</button>
                </div>
            </div>

            <button id="btnLogin" class="btn-login" onclick="iniciarSesion()">
                <span class="btn-text">Iniciar Sesión</span>
                <span class="spinner"></span>
            </button>
        </div>

        <!-- FOOTER -->
        <div class="login-footer">
            <p>¿Olvidaste tu contraseña? <a href="#" onclick="recuperarPassword(event)">Recuperar acceso</a></p>
            <p style="margin-top: 8px;">Secretaría de Posgrado — FCE UNCUYO</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL = 'https://fdevypdowdhqaxvfiywt.supabase.co';
var SUPABASE_KEY = 'sb_publishable_PxypVbCcQuum2EtxuJRmkg_korPHaCW';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var RUTAS = {
    'ESTUDIANTE':          'portal_estudiante_2_dashboard.html',
    'COORDINADOR':         'coordinador_1_dashboard.html',
    'PROFESOR':            'profesor_1_dashboard.html',
    'SECRETARIA':          'secretaria_1_dashboard.html',
    'COOPERADORA':         'cooperadora_2_Dashboard.html',
    'ADMINISTRADOR':       'administrador_2_dashboard.html'
};

function togglePassword() {
    var input = document.getElementById('password');
    var btn = document.querySelector('.toggle-pass');
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}

function mostrarError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
}
function limpiarError() {
    document.getElementById('errorMsg').classList.remove('show');
}

async function iniciarSesion() {
    limpiarError();
    var dni = document.getElementById('dni').value.trim();
    var password = document.getElementById('password').value;

    if (!dni) { mostrarError('Ingresá tu DNI'); document.getElementById('dni').focus(); return; }
    if (!/^\d{7,10}$/.test(dni)) { mostrarError('El DNI debe tener entre 7 y 10 dígitos numéricos'); document.getElementById('dni').focus(); return; }
    if (!password) { mostrarError('Ingresá tu contraseña'); document.getElementById('password').focus(); return; }

    var btn = document.getElementById('btnLogin');
    btn.classList.add('loading');
    btn.disabled = true;

    try {
        var { data: loginInfo, error: loginErr } = await sb.rpc('get_login_info', { p_dni: dni });

        if (loginErr || !loginInfo) {
            btn.classList.remove('loading');
            btn.disabled = false;
            mostrarError('DNI o contraseña incorrectos');
            return;
        }
        if (!loginInfo.activo) {
            btn.classList.remove('loading');
            btn.disabled = false;
            mostrarError('Usuario inactivo');
            return;
        }

        var resultado = await sb.auth.signInWithPassword({ email: loginInfo.email, password: password });

        if (resultado.error) {
            btn.classList.remove('loading');
            btn.disabled = false;
            mostrarError('DNI o contraseña incorrectos');
            return;
        }

        var respPre = await sb.from('usuarios').select('rol, nombre_completo, email, programa_id, dni').eq('dni', dni).single();
        var usuario = respPre.data;

        localStorage.setItem('sigpo_rol', usuario.rol);
        localStorage.setItem('sigpo_nombre', usuario.nombre_completo);
        localStorage.setItem('sigpo_dni', usuario.dni);
        localStorage.setItem('sigpo_email', usuario.email);
        localStorage.setItem('sigpo_programa_id', usuario.programa_id || '');

        var destino = RUTAS[usuario.rol] || 'portal_estudiante_2_dashboard.html';
        window.location.href = destino;

    } catch (err) {
        btn.classList.remove('loading');
        btn.disabled = false;
        mostrarError('Error técnico al iniciar sesión. Por favor, intentá de nuevo.');
        console.error('Login error:', err);
    }
}

async function recuperarPassword(e) {
    e.preventDefault();
    var dni = document.getElementById('dni').value.trim();
    if (!dni) {
        alert('Ingresá tu DNI y hacé clic en "Recuperar acceso".\nSe enviará un correo a tu email registrado con instrucciones.');
        document.getElementById('dni').focus();
        return;
    }

    var resp = await sb.from('usuarios').select('email').eq('dni', dni).single();
    if (resp.error || !resp.data) {
        alert('Si el DNI está registrado, recibirás un correo con instrucciones para recuperar el acceso.');
        return;
    }

    var email = resp.data.email;
    var partes = email.split('@');
    var oculto = partes[0].substring(0, 3) + '***@' + partes[1];
    alert('📧 Se enviarán instrucciones de recuperación a ' + oculto);
}

document.addEventListener('DOMContentLoaded', async function() {
    await sb.auth.signOut();
    localStorage.removeItem('sigpo_rol');
    localStorage.removeItem('sigpo_nombre');
    localStorage.removeItem('sigpo_dni');
    localStorage.removeItem('sigpo_email');
    localStorage.removeItem('sigpo_programa_id');
    document.getElementById('dni').focus();
});
</script>
</body>
</html>
