<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cohortes del Programa - Profesor</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --primary:#5C1018; --accent:#8C1A28; --bg:#f8f6f1; --success:#2d7a4f; --warning:#e67e22; --danger:#c0392b; --muted:#6b7280; --line:#e5e7eb; }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:#2c2c2c; font-size:14px; }

        .header { background:linear-gradient(135deg,#5C1018 0%,#8C1A28 100%); color:white; padding:20px 40px; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
        .header-content { max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .header-left .breadcrumb { font-size:13px; opacity:0.85; margin-bottom:8px; }
        .header-left h1 { font-family:'Crimson Pro',serif; font-size:26px; margin-bottom:4px; }
        .header-left p { opacity:0.85; font-size:13px; }
        .header-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }

        .notif-wrapper { position:relative; display:inline-block; }
        .notif-btn { background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.38); color:white; padding:8px 12px; border-radius:8px; font-size:18px; cursor:pointer; position:relative; transition:background .2s; }
        .notif-btn:hover { background:rgba(255,255,255,0.26); }
        #notif-badge { position:absolute; top:-4px; right:-4px; background:#ef4444; color:white; border-radius:50%; min-width:18px; height:18px; font-size:10px; font-weight:700; display:none; align-items:center; justify-content:center; padding:0 3px; }
        #notif-dropdown { display:none; position:absolute; right:0; top:48px; width:320px; background:white; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:500; overflow:hidden; color:#2c2c2c; border:1px solid #e5e7eb; }
        .notif-head { padding:14px 16px; border-bottom:1px solid #f0f0f0; font-weight:700; color:#5C1018; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .notif-head button { background:none; border:none; color:#8C1A28; font-size:12px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }

        .btn-back { background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.38); color:white; padding:9px 18px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .2s; }
        .btn-back:hover { background:rgba(255,255,255,0.28); }
        .logout-btn { background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.38); color:white; padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .2s; display:inline-flex; align-items:center; gap:7px; }
        .logout-btn:hover { background:rgba(192,57,43,0.55); }

        .container { max-width:1200px; margin:32px auto; padding:0 24px; }
        .readonly-notice { background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; padding:10px 16px; border-radius:8px; margin-bottom:24px; font-size:13px; }

        .cohortes-list { display:flex; flex-direction:column; gap:16px; }

        .cohorte-card { background:white; border-radius:12px; padding:24px 28px; cursor:pointer; transition:all 0.25s ease; border:2px solid transparent; box-shadow:0 2px 12px rgba(0,0,0,0.06); display:flex; justify-content:space-between; align-items:center; }
        .cohorte-card:hover { border-color:#8C1A28; transform:translateX(6px); box-shadow:0 8px 24px rgba(0,0,0,0.12); }
        .cohorte-card.active { border-color:#C49A2A; background:linear-gradient(90deg,#fff9e6 0%,white 35%); }

        .cohorte-left { flex:1; }
        .cohorte-title { font-size:20px; font-weight:700; color:var(--primary); margin-bottom:6px; }
        .cohorte-dates { color:#666; font-size:14px; margin-bottom:14px; }
        .cohorte-stats { display:flex; gap:28px; flex-wrap:wrap; }
        .stat-box { display:flex; flex-direction:column; }
        .stat-label { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px; }
        .stat-value { font-size:18px; font-weight:700; color:var(--primary); }
        .stat-value.success { color:var(--success); }
        .stat-value.danger  { color:var(--danger); }
        .stat-value.warning { color:var(--warning); }
        .saldo-pos { color:var(--success); font-weight:700; }
        .saldo-neg { color:var(--danger); font-weight:700; }

        .cohorte-right { display:flex; align-items:center; gap:16px; }
        .badge { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
        .badge-activa { background:#d4edda; color:var(--success); }
        .badge-cerrada { background:#e8e8e8; color:#666; }
        .arrow { font-size:26px; color:#C49A2A; transition:transform 0.25s; }
        .cohorte-card:hover .arrow { transform:translateX(6px); }

        .empty { text-align:center; padding:48px; color:var(--muted); border:2px dashed var(--line); border-radius:10px; font-size:15px; }
        .loading { text-align:center; padding:40px; color:var(--muted); }
        .error-banner { background:#fee2e2; border:1px solid #fca5a5; color:#991b1b; padding:14px 18px; border-radius:8px; margin-bottom:20px; font-size:14px; display:none; }

        @media(max-width:680px) { .header { padding:16px 18px; } .container { padding:0 16px; } .cohorte-stats { gap:16px; } }
    </style>
    <link rel="stylesheet" href="sigpo-theme.css">
</head>
<body>

<div class="header">
    <div class="header-content">
        <div class="header-left">
            <div class="breadcrumb">
                <button onclick="navegar('profesor_1_dashboard.html')" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;padding:6px 13px;border-radius:8px;font-size:12px;cursor:pointer;margin-bottom:10px;display:inline-flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;font-weight:600;transition:background 0.2s;">← Volver</button>
            </div>
            <h1 id="hdr-programa">Cohortes del Programa</h1>
            <p id="hdr-sub">Cargando…</p>
        </div>
        <div class="header-right">
            <div class="notif-wrapper">
                <button class="notif-btn" onclick="toggleNotif()" title="Notificaciones">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span id="notif-badge"></span>
                </button>
                <div id="notif-dropdown">
                    <div class="notif-head"><span>🔔 Notificaciones</span><button onclick="marcarTodasLeidas()">Marcar leídas</button></div>
                    <div id="notif-list" style="max-height:320px;overflow-y:auto;"><div style="padding:24px;text-align:center;color:#9ca3af;font-size:13px;">Cargando…</div></div>
                </div>
            </div>
            <button class="logout-btn" onclick="cerrarSesion()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Cerrar sesión
            </button>
        </div>
    </div>
</div>

<div class="container">
    <div class="error-banner" id="errorBanner"></div>
    <div class="readonly-notice">👁️ Modo solo lectura — podés ver las cohortes y sus estados financieros.</div>
    <div id="cohortes-list" class="cohortes-list"><div class="loading">Cargando…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>
<script>
var PROGRAMA_ID = new URLSearchParams(location.search).get('programa_id') || '';

function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fM(n) { var num=parseFloat(n||0); if(isNaN(num))return '$0,00'; return (num<0?'-$':'$')+Math.abs(num).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

var _notifs = [];
function toggleNotif() { var dd=document.getElementById('notif-dropdown'); if(dd)dd.style.display=dd.style.display==='block'?'none':'block'; }
document.addEventListener('click', function(e){ var w=document.querySelector('.notif-wrapper'); if(w&&!w.contains(e.target)){var dd=document.getElementById('notif-dropdown');if(dd)dd.style.display='none';} });
function renderNotificaciones(datos) {
    _notifs=datos||[];
    var sinLeer=_notifs.filter(function(n){return !n.leida;}).length;
    var badge=document.getElementById('notif-badge'); if(badge){badge.textContent=sinLeer;badge.style.display=sinLeer>0?'flex':'none';}
    var lista=document.getElementById('notif-list'); if(!lista)return;
    if(!_notifs.length){lista.innerHTML='<div style="padding:24px;text-align:center;color:#9ca3af;font-size:13px;">Sin notificaciones</div>';return;}
    lista.innerHTML=_notifs.map(function(n){return '<div style="padding:12px 16px;border-bottom:1px solid #f3f4f6;font-size:13px;color:#374151;">'+esc(n.mensaje)+'</div>';}).join('');
}
function marcarTodasLeidas(){_notifs.forEach(function(n){n.leida=true;});renderNotificaciones(_notifs);}

document.addEventListener('DOMContentLoaded', async function() {
    var sesion = getSesion();
    if (!sesion || sesion.rol !== 'PROFESOR') { window.location.href = 'portal_login.html'; return; }
    if (!PROGRAMA_ID) { mostrarError('No se especificó el programa.'); return; }
    if (typeof obtenerNotificaciones === 'function') obtenerNotificaciones('PROFESOR').then(renderNotificaciones);
    try { await cargar(sesion); } catch(e) { mostrarError('Error al cargar datos: ' + e.message); }
});

async function cargar(sesion) {
    var sb = await getSupabase();

    var progIds = await obtenerProgramasAsignadosPorDni(sesion.dni);
    if (progIds.indexOf(parseInt(PROGRAMA_ID,10)) < 0 && progIds.indexOf(PROGRAMA_ID) < 0) {
        mostrarError('No tenés acceso a este programa.');
        return;
    }

    var [rProg, rCoh, rCob, rEgr, rInsc] = await Promise.all([
        sb.from('programas').select('programa_id,nombre,tipo').eq('programa_id', PROGRAMA_ID).single(),
        sb.from('cohortes').select('cohorte_id,nombre,estado,fecha_inicio,fecha_fin').eq('programa_id', PROGRAMA_ID),
        sb.from('cobros').select('dni,cohorte_id,estado,monto_final,saldo_pendiente').eq('programa_id', PROGRAMA_ID),
        sb.from('egresos').select('cohorte_id,tipo,monto_pagado,monto_original').eq('programa_id', PROGRAMA_ID),
        sb.from('inscripciones').select('estudiante_id,cohorte_id').eq('programa_id', PROGRAMA_ID)
    ]);

    var prog = rProg.data || {};
    var cohortes = rCoh.data || [];
    var cobros = rCob.data || [];
    var egresos = rEgr.data || [];
    var inscs = rInsc.data || [];

    document.getElementById('hdr-programa').textContent = prog.nombre || 'Programa';
    var activas = cohortes.filter(function(c){return c.estado==='ACTIVO';}).length;
    document.getElementById('hdr-sub').textContent = cohortes.length + ' cohorte' + (cohortes.length!==1?'s':'') + ' · ' + activas + ' activa' + (activas!==1?'s':'');

    var lista = document.getElementById('cohortes-list');
    if (!cohortes.length) { lista.innerHTML = '<div class="empty">No hay cohortes para este programa.</div>'; return; }

    lista.innerHTML = cohortes.map(function(c) {
        var cobs = cobros.filter(function(x){return x.cohorte_id===c.cohorte_id;});
        var egrs = egresos.filter(function(x){return x.cohorte_id===c.cohorte_id&&x.tipo==='EJECUTADO';});
        var inscC = inscs.filter(function(i){return i.cohorte_id===c.cohorte_id;});
        var dnis = new Set(cobs.map(function(x){return x.dni;}));
        var alDia = new Set(cobs.filter(function(x){return x.estado==='ABONADA';}).map(function(x){return x.dni;})).size;
        var mora  = new Set(cobs.filter(function(x){return x.estado==='EN_MORA';}).map(function(x){return x.dni;})).size;
        var parcial = new Set(cobs.filter(function(x){return x.estado==='PAGO_PARCIAL';}).map(function(x){return x.dni;})).size;
        var rec = cobs.filter(function(x){return x.estado==='ABONADA'||x.estado==='PAGO_PARCIAL';})
                      .reduce(function(s,x){return s+Math.max(0,Number(x.monto_final||0)-Number(x.saldo_pendiente||0));},0);
        var egr = egrs.reduce(function(s,x){return s+Number(x.monto_pagado||x.monto_original||0);},0);
        var sal = rec - egr;
        var isActiva = c.estado==='ACTIVO';
        var fechas = [c.fecha_inicio, c.fecha_fin].filter(Boolean).join(' → ');
        var badgeHtml = isActiva
            ? '<span class="badge badge-activa">Activa</span>'
            : '<span class="badge badge-cerrada">Cerrada</span>';
        return '<div class="cohorte-card'+(isActiva?' active':'')+'" onclick="navegar(\'profesor_3_cohorte.html?cohorte_id='+c.cohorte_id+'\')">'
            + '<div class="cohorte-left">'
            + '<div class="cohorte-title">'+esc(c.nombre||'Cohorte')+'</div>'
            + '<div class="cohorte-dates">'+esc(fechas)+'</div>'
            + '<div class="cohorte-stats">'
            + '<div class="stat-box"><div class="stat-label">Estudiantes</div><div class="stat-value">'+dnis.size+'</div></div>'
            + '<div class="stat-box"><div class="stat-label">Al día</div><div class="stat-value success">'+alDia+'</div></div>'
            + '<div class="stat-box"><div class="stat-label">En mora</div><div class="stat-value danger">'+mora+'</div></div>'
            + '<div class="stat-box"><div class="stat-label">Pago parcial</div><div class="stat-value warning">'+parcial+'</div></div>'
            + '<div class="stat-box"><div class="stat-label">Recaudado</div><div class="stat-value">'+fM(rec)+'</div></div>'
            + '<div class="stat-box"><div class="stat-label">Egresos</div><div class="stat-value">'+fM(egr)+'</div></div>'
            + '<div class="stat-box"><div class="stat-label">Saldo</div><div class="stat-value '+(sal>=0?'saldo-pos':'saldo-neg')+'">'+fM(sal)+'</div></div>'
            + '</div></div>'
            + '<div class="cohorte-right">'+badgeHtml+'<span class="arrow">→</span></div>'
            + '</div>';
    }).join('');
}

function mostrarError(msg) {
    var el = document.getElementById('errorBanner');
    el.textContent = '⚠️ ' + msg;
    el.style.display = 'block';
}
</script>
</body>
</html>
